openapi: 3.0.3
info:
  title: Goth Scaffold API
  description: |
    Generated from the scaffold route tree and namespaced @goai directives.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Public
    description: Endpoints that do not require authentication.
paths:
  /api/v1/health:
    get:
      tags:
        - Public
      summary: Check service health
      description: Returns the current liveness status without authentication.
      operationId: health.get
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                healthy:
                  summary: Healthy response
                  value:
                    status: ok
      security: []
components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
      required:
        - status
